<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Copilot -- Test Checkout</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; background: #f4f6f9; color: #1c2733;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 32px 36px; width: 380px; max-width: 90vw;
    box-shadow: 0 8px 30px rgba(20, 30, 50, 0.08);
  }
  h1 { font-size: 1.25rem; margin: 0 0 6px; }
  p.sub { color: #5b6b7c; font-size: 0.9rem; margin: 0 0 22px; line-height: 1.4; }
  label { font-size: 0.85rem; color: #33424f; font-weight: 600; display: block; margin-bottom: 6px; }
  input[type="number"], select {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #d5dce3; font-size: 1rem; margin-bottom: 18px; background: #fff;
    font-family: inherit; color: inherit;
  }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2a78d6;
    color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: #a9c3e6; cursor: not-allowed; }
  #status { margin-top: 16px; font-size: 0.88rem; line-height: 1.5; white-space: pre-wrap; }
  .status-ok { color: #17803d; }
  .status-error { color: #b3261e; }
  .status-info { color: #5b6b7c; }
  .badge {
    display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 3px 8px;
    border-radius: 999px; background: #fff3cd; color: #8a6300; margin-bottom: 16px;
  }
  #decision { margin-top: 14px; padding: 14px 16px; border-radius: 10px; display: none; }
  #decision.show { display: block; }
  #decision.thinking { background: #f4f6f9; border: 1px solid #d5dce3; }
  #decision.ready { background: #eefaf1; border: 1px solid #b7e4c7; }
  #decision.timeout { background: #fdf3f0; border: 1px solid #f0c4b8; }
  #decision h3 { margin: 0 0 6px; font-size: 0.95rem; }
  #decision ul { margin: 6px 0 0; padding-left: 18px; font-size: 0.85rem; color: #33424f; }
  .spinner {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #eb6834; margin-right: 6px; animation: pulse 1s infinite ease-in-out;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div class="card">
  <div class="badge">TEST MODE</div>
  <h1>Recovery Copilot -- test checkout</h1>
  <p class="sub">
    This is a real Razorpay Test Mode payment (no real money moves). Use a
    <a href="https://razorpay.com/docs/payments/payments/test-card-upi-details/" target="_blank" rel="noopener">documented test failure card</a>
    to see the failure flow live into Recovery Copilot's agent, right here, seconds after it fails.
  </p>
  <label for="amount">Amount (INR)</label>
  <input id="amount" type="number" value="500" min="1" step="1">
  <label for="customer-segment">Customer type</label>
  <select id="customer-segment">
    <option value="new">New customer</option>
    <option value="returning" selected>Returning customer</option>
    <option value="vip">VIP customer</option>
  </select>
  <button id="pay-btn">Pay with Razorpay</button>
  <div id="status" class="status-info"></div>
  <div id="decision"></div>
</div>

<script>
const statusEl = document.getElementById('status');
const payBtn = document.getElementById('pay-btn');

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || 'status-info';
}

fetch('/razorpay/status').then(r => r.json()).then(d => {
  if (!d.configured) {
    setStatus('This server has no Razorpay account connected yet (RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET not set). See pitch/razorpay_live_setup.md.', 'status-error');
    payBtn.disabled = true;
  }
}).catch(() => {});

payBtn.onclick = async function () {
  const amount = parseFloat(document.getElementById('amount').value);
  if (!amount || amount <= 0) {
    setStatus('Enter a valid amount.', 'status-error');
    return;
  }
  payBtn.disabled = true;
  setStatus('Creating order...', 'status-info');

  const customerSegment = document.getElementById('customer-segment').value;

  let orderData;
  try {
    const resp = await fetch('/checkout/create-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: amount, customer_segment: customerSegment }),
    });
    orderData = await resp.json();
    if (!resp.ok || !orderData.ok) {
      setStatus('Could not create order: ' + (orderData.detail || orderData.error || resp.statusText), 'status-error');
      payBtn.disabled = false;
      return;
    }
  } catch (err) {
    setStatus('Network error creating order: ' + err, 'status-error');
    payBtn.disabled = false;
    return;
  }

  const options = {
    key: orderData.key_id,
    amount: orderData.amount,
    currency: orderData.currency,
    order_id: orderData.order_id,
    name: 'Recovery Copilot',
    description: 'Test transaction',
    handler: async function (response) {
      setStatus('Verifying payment on the backend...', 'status-info');
      try {
        const verifyResp = await fetch('/checkout/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature,
          }),
        });
        const verifyData = await verifyResp.json();
        if (verifyData.ok) {
          setStatus('Payment verified by the backend (signature checked, not just trusted from the browser).', 'status-ok');
        } else {
          setStatus('Signature verification FAILED -- this payment is not trusted.', 'status-error');
        }
      } catch (err) {
        setStatus('Network error verifying payment: ' + err, 'status-error');
      }
      payBtn.disabled = false;
    },
    modal: {
      ondismiss: function () {
        setStatus('Checkout closed.', 'status-info');
        payBtn.disabled = false;
      },
    },
    theme: { color: '#2a78d6' },
  };

  const rzp = new Razorpay(options);
  rzp.on('payment.failed', function (response) {
    setStatus('Payment failed: ' + response.error.description, 'status-error');
    payBtn.disabled = false;
    const paymentId = response.error && response.error.metadata && response.error.metadata.payment_id;
    if (paymentId) {
      pollForDecision(paymentId);
    } else {
      showDecisionBox('timeout', 'Payment failed, but no payment ID was available to look up the decision.');
    }
  });
  rzp.open();
};

const ACTION_LABEL = {
  SEND_MESSAGE: 'Sent a reminder', RETRY_PAYMENT: 'Retried the payment',
  ESCALATE_HUMAN: 'Sent to a specialist', ESCALATE_COLLECTIONS: 'Sent to collections/legal',
  ESCALATE_OPS: 'Flagged as a system issue', STOP: 'Left alone (not worth pursuing)',
};

function friendlyReasoning(text) {
  return text.replace(/[Rr]ecoverability score \(?(\d+\.\d+)\)?/, (m, p1) => `Confidence (${Math.round(parseFloat(p1) * 100)}%)`);
}

function showDecisionBox(cls, html) {
  const box = document.getElementById('decision');
  box.className = 'show ' + cls;
  box.innerHTML = html;
}

async function pollForDecision(paymentId, attempt = 1, maxAttempts = 12) {
  showDecisionBox('thinking', `<span class="spinner"></span>Waiting for Recovery Copilot's decision on this failure&hellip; (Razorpay's webhook usually lands within a few seconds)`);
  let data;
  try {
    const resp = await fetch(`/checkout/decision/${paymentId}`);
    data = await resp.json();
  } catch (err) {
    data = { found: false };
  }
  if (data.found) {
    const actionLabel = ACTION_LABEL[data.action] || data.action;
    const reasoningHtml = (data.reasoning || []).map(r => `<li>${friendlyReasoning(r)}</li>`).join('');
    let executionHtml = '';
    if (data.executed && data.execution_detail && data.execution_detail.type === 'payment_link') {
      executionHtml = `<p style="margin-top:8px;color:#17803d;">&#9989; A real payment link was created: ` +
        `<a href="${data.execution_detail.short_url}" target="_blank" rel="noopener">${data.execution_detail.short_url}</a></p>`;
    } else if (data.executed && data.execution_detail && data.execution_detail.type === 'email') {
      executionHtml = `<p style="margin-top:8px;color:#17803d;">&#9989; A real email was sent to ${data.execution_detail.sent_to}</p>`;
    } else if (data.execution_detail && data.execution_detail.error) {
      executionHtml = `<p style="margin-top:8px;color:#b3261e;">&#9888; Execution failed: ${data.execution_detail.error}</p>`;
    }
    showDecisionBox('ready',
      `<h3>Recovery Copilot's decision: <strong>${actionLabel}</strong></h3>` +
      (reasoningHtml ? `<ul>${reasoningHtml}</ul>` : '') + executionHtml
    );
    return;
  }
  if (attempt >= maxAttempts) {
    showDecisionBox('timeout',
      `No decision showed up after ${(maxAttempts * 1.5).toFixed(0)}s -- the webhook may not have reached this server yet ` +
      `(check the tunnel is still up), or it's still on its way. Check the dashboard's Live tab shortly.`
    );
    return;
  }
  setTimeout(() => pollForDecision(paymentId, attempt + 1, maxAttempts), 1500);
}
</script>
</body>
</html>
